# Full stack: Postgres + Redis + FastAPI backend + React UI (nginx).
#   cp .env.example .env   # fill in API keys + JWT_SECRET
#   docker compose up -d --build
#   open http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newsdeck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newsdeck}
      POSTGRES_DB: ${POSTGRES_DB:-newsdeck}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newsdeck} -d ${POSTGRES_DB:-newsdeck}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-internal addresses override whatever .env says for local dev.
      DATABASE_URL: postgresql://${POSTGRES_USER:-newsdeck}:${POSTGRES_PASSWORD:-newsdeck}@db:5432/${POSTGRES_DB:-newsdeck}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui:
    build: ./ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
