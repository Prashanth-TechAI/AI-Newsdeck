[project]
name = "news-dashboard-backend"
version = "0.1.0"
description = "FastAPI backend for the NewsPulse AI news dashboard"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "pydantic>=2.10.2",
    "pydantic-settings>=2.6.1",
    "pydantic[email]>=2.10.2",
    "httpx>=0.27.2",
    "openai>=1.55.3",
    "python-dotenv>=1.0.1",
    "langgraph>=0.4.0",
    "tenacity>=8.5.0",
    "sqlalchemy>=2.0.36",
    "greenlet>=3.1.1",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "bcrypt>=4.2.0",
    "python-jose[cryptography]>=3.3.0",
    "apscheduler>=3.10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
